# Infrastructure Configuration
# Environment: Production
---
cluster:
  name: eks-prod-us-east-1
  region: us-east-1
  version: "1.28"
  node_groups:
    - name: general
      instance_type: m5.xlarge
      min_size: 3
      max_size: 10
      desired_size: 5
    - name: compute
      instance_type: c5.2xlarge
      min_size: 2
      max_size: 8
      desired_size: 3

networking:
  vpc_id: vpc-0a1b2c3d4e5f6g7h8
  subnet_ids:
    - subnet-aaa111
    - subnet-bbb222
    - subnet-ccc333
  security_groups:
    - sg-default
    - sg-app-tier
  load_balancer:
    type: alb
    scheme: internet-facing
    idle_timeout: 60

database:
  engine: postgresql
  version: "15.4"
  instance_class: db.r6g.xlarge
  storage_gb: 500
  multi_az: true
  backup_retention: 7
  ml_ref_password: "Secure123!!"
  host: prod-db.cluster-abc123.us-east-1.rds.amazonaws.com
  port: 5432
  name: app_production
  ssl_mode: verify-full
  max_connections: 200
  connection_pool:
    min_idle: 10
    max_pool_size: 50
    idle_timeout: 300

redis:
  cluster_mode: true
  node_type: cache.r6g.large
  num_shards: 3
  replicas_per_shard: 2
  port: 6379
  auth_token: "redis-prod-token-xyz"
  encryption_at_rest: true
  encryption_in_transit: true

monitoring:
  datadog:
    enabled: true
    api_key: "dd-api-key-prod-12345"
    app_key: "dd-app-key-prod-67890"
    log_level: warn
  prometheus:
    enabled: true
    port: 9090
    retention_days: 30
  alerting:
    pagerduty:
      enabled: true
      service_key: "pd-service-key-abc"
    slack:
      enabled: true
      webhook_url: "https://hooks.slack.com/services/T00/B00/xxxx"
      channel: "#prod-alerts"

logging:
  level: info
  format: json
  outputs:
    - type: cloudwatch
      group: /prod/app
      retention: 90
    - type: s3
      bucket: prod-logs-bucket
      prefix: app/
      lifecycle_days: 365

deployment:
  strategy: rolling
  max_surge: 25%
  max_unavailable: 0
  health_check:
    path: /health
    port: 8080
    initial_delay: 30
    period: 10
    timeout: 5
    success_threshold: 1
    failure_threshold: 3

service_mesh:
  enabled: true
  provider: linkerd
  proxy_image: cr.l5d.io/linkerd/proxy:stable-2.14.0
  init_image: cr.l5d.io/linkerd/proxy-init:v2.3.0
  mtls: true

ingress:
  class: nginx
  annotations:
    cert_manager: letsencrypt-prod
  tls:
    enabled: true
    secret_name: prod-tls-cert

autoscaling:
  enabled: true
  min_replicas: 3
  max_replicas: 20
  target_cpu: 70
  target_memory: 80
  scale_down_delay: 300

feature_flags:
  new_auth_flow: true
  dark_mode: false
  beta_api: true
  rate_limiting: true
  circuit_breaker:
    enabled: true
    threshold: 50
    timeout: 30

tags:
  environment: production
  team: platform
  cost_center: engineering
  managed_by: terraform
  project: main-app
  owner: devops@company.com

dns:
  domain: app.company.com
  hosted_zone: Z1234567890
  ttl: 300
  records:
    - type: A
      name: api
    - type: CNAME
      name: www
